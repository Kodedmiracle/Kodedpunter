name: Collect Results

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Collect fixtures and results
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node collectResults.cjs

      - name: Build team ratings
        run: node buildRatings.cjs

      - name: Generate extra predictions
        run: node generateExtraPredictions.cjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ public/extra-predictions.json
          git diff --cached --quiet || (git commit -m "Collect results and refresh extra predictions" && git pull --rebase origin main && git push)
